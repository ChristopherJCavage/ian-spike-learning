# 2M pin with 2M axle molded on (bush with axle)
65249.dat:
  role: connector
  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -30, t1: 0}
    - {type: cross_axle,   origin: [0, 0, 0], axis: [1, 0, 0], t0: 0, t1: 29.5}

