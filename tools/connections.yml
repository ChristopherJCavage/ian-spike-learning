    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -49.5, t1: 49.5}

44294.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -69.5, t1: 69.5}

