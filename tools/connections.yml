# ---------------------------------------------------------------------------
# Bushes sit on axles; they are retainers, not two-ended fasteners.
# Marked structural so "joins two parts" does not apply; "must have a joint"
# still does -- a bush in mid-air fails. A bush's entire job is to ride an
# axle without locking it, so it -- and whatever else only ever reaches the
# model through that same free-spinning axle -- is exempt from the rigid
# cluster hinge check (rotates: true).
4265c.dat:
  role: structural
  rotates: true
  features:
    - {kind: axle_hole, gender: female, origin: [0, 0, 0], axis: [0, 0, 1], depth: 10}

32123b.dat:
  role: structural
  rotates: true
  features:
    - {kind: axle_hole, gender: female, origin: [0, 0, 0], axis: [0, 0, 1], depth: 10}

32123.dat:
  role: structural
  rotates: true
  features:
    - {kind: axle_hole, gender: female, origin: [0, 0, 0], axis: [0, 0, 1], depth: 10}

3713.dat:
  role: structural
  rotates: true
  features:
    - {kind: axle_hole, gender: female, origin: [0, 0, 0], axis: [0, 0, 1], depth: 20}

