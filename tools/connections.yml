# ---------------------------------------------------------------------------
# Wheel dia.56 -- spoke pin holes exist as primitives; the centre CROSS
# axle hole is mesh-only. Native wheel axis is Z. Wheels are meant to
# spin on their axle, so a single cross_axle reaching one is not a hinge.
# ---------------------------------------------------------------------------
39367.dat:
  role: structural
  rotates: true
  ground_contact: true
  features:
    - {kind: axle_hole, gender: female, origin: [0, 0, 0], axis: [0, 0, 1], depth: 35}

# ---------------------------------------------------------------------------
# Drill bit cone -- reused here as the spinning tip of the mining drill,
# driven by the same cross axle that runs the bush above.
# ---------------------------------------------------------------------------
14918.dat:
  role: structural
  rotates: true

# Seat 4079 is a 2x2 with a backrest. LDraw emits only the centre underside
# tube (stud4 at the origin) and two top studs; the four corner tubes that
# actually clutch a plate are missing. Origins are at the underside face
# (local y=8) so the 4 LDU stud shaft overlaps the bore.
4079.dat:
  role: structural
  features:
    - {kind: pin_hole, gender: female, origin: [10, 8, 10], axis: [0, -1, 0], depth: 8}
    - {kind: pin_hole, gender: female, origin: [10, 8, -10], axis: [0, -1, 0], depth: 8}
    - {kind: pin_hole, gender: female, origin: [-10, 8, 10], axis: [0, -1, 0], depth: 8}
    - {kind: pin_hole, gender: female, origin: [-10, 8, -10], axis: [0, -1, 0], depth: 8}

# Round dish -- LDraw already emits a stud and an underside tube.
35394.dat:
  role: structural

