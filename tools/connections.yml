# ---------------------------------------------------------------------------
# Decorative -- joint-exempt
# ---------------------------------------------------------------------------
# 1x1 round tile. Stays decorative -- the mining-drill-truck uses two of
# these as eyes glued flat against a beam face with nothing plugged into
# them, and making the role structural would demand a joint that build
# does not have. But the chameleon presses these onto the bare tip of a
# friction peg (a real MOC trick: a peg's shank is close enough to a
# stud's diameter that a tile's underside tube grips it), and that
# connection is worth verifying where it is claimed. So: add the tube as
# a `pin_hole` rather than the usual `anti_stud` -- COMPAT only lets
# friction_pin mate with pin_hole, and stud already mates with both, so
# pin_hole covers this part's two real use cases (capping a peg, or its
# ordinary job sitting on a stud) without forcing the joint requirement
# onto the truck's decal-style eyes. One tube, dead centre, underside at
# y=8 -- same convention as every other single-tile annotation above.
98138.dat:
  role: decorative
  features:
    - {kind: pin_hole, gender: female, origin: [0, 8, 0], axis: [0, -1, 0], depth: 8}
