# Connection annotations for SPIKE Prime (45678) + Essential (45345)
# + Prime Expansion (45681).
#
# LDraw encodes female holes as named primitives, but not male shafts, and
# some electronics/wheels have bespoke mesh with no primitives at all.
# This file fills those gaps. Keys are LDraw part names (after aliasing).
#
# role:
#   connector   -- fastener; must join at least two distinct parts
#   structural  -- default if omitted; must have at least one real joint
#   decorative  -- exempt from joint requirements (eyes, dog, antennae, plants)
#
# shafts: male features. axis/origin are in the part's own coordinates.
#   t0, t1 = extent along axis from origin, in LDU.
# features: extra female (or male) points LDraw does not emit as primitives.

# ---------------------------------------------------------------------------
# Friction pins -- native shaft along +X
# ---------------------------------------------------------------------------
61332.dat:
  role: connector
  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -20, t1: 20}

42924.dat:
  role: connector
  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -30, t1: 30}

6558.dat:
  role: connector
  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -30, t1: 30}

# Pin one end, axle the other (CONNECTOR PEG/CROSS AXLE)
6562.dat:
  role: connector
  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -20, t1: 0}
    - {type: cross_axle,   origin: [0, 0, 0], axis: [1, 0, 0], t0: 0, t1: 19.5}

# 2M axle with friction snap -- 3M overall, pin + axle
18651.dat:
  role: connector
  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -30, t1: -10}
    - {type: cross_axle,   origin: [0, 0, 0], axis: [1, 0, 0], t0: -10, t1: 29.5}

# 2M friction snap with cross hole through the middle
32054.dat:
  role: connector
  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -30, t1: 30}

65304.dat:
  role: connector
  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -30, t1: 30}

# ---------------------------------------------------------------------------
# Cross axles -- native shaft along +X (except the 2M extender, along +Z)
# ---------------------------------------------------------------------------
32062.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -19.5, t1: 19.5}

4519.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -29.5, t1: 29.5}

3705.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -39.5, t1: 39.5}

3706.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -59.5, t1: 59.5}

3707.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -79.5, t1: 79.5}

32073.dat:
