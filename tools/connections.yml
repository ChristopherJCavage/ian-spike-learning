# 2x2 round tile with a hole straight through the middle. The underside is
# a single centre tube (stud4h), and a centre tube grips studs at the four
# CORNERS -- nothing ever sits at a 2x2's centre. Annotating the tube where
# LDraw draws it gave a part that could not clutch to anything.
15535.dat:
  role: structural
  features:
    - {kind: anti_stud, gender: female, origin: [10, 8, 10], axis: [0, -1, 0], depth: 8}
    - {kind: anti_stud, gender: female, origin: [10, 8, -10], axis: [0, -1, 0], depth: 8}
    - {kind: anti_stud, gender: female, origin: [-10, 8, 10], axis: [0, -1, 0], depth: 8}
    - {kind: anti_stud, gender: female, origin: [-10, 8, -10], axis: [0, -1, 0], depth: 8}
    - {kind: pin_hole, gender: female, origin: [0, 4, 0], axis: [0, 1, 0], depth: 8}

# Same 2x2 round tile without the through-hole -- LDraw's "Tile 2x2 Round
# with Round Underside Stud", the drone's eyes. LDraw emits only the
# underside holder's bore as a lone centre pin_hole, which joins nothing,
# because nothing ever sits at a 2x2's centre. The holder actually grips
# the four studs around it, exactly as on 15535 above.
14769.dat:
  role: structural
  features:
    - {kind: anti_stud, gender: female, origin: [10, 8, 10], axis: [0, -1, 0], depth: 8}
    - {kind: anti_stud, gender: female, origin: [10, 8, -10], axis: [0, -1, 0], depth: 8}
    - {kind: anti_stud, gender: female, origin: [-10, 8, 10], axis: [0, -1, 0], depth: 8}
    - {kind: anti_stud, gender: female, origin: [-10, 8, -10], axis: [0, -1, 0], depth: 8}

# LDraw calls this a dish; the kits call it a slide shoe, and the kit name
# is the useful one. Domed bottom that slides on the floor, four studs on
# TOP that hold it to the model. Those studs are stud6a, a spelling the
# primitive table does not carry, so the part read as having no clutch at
# all -- and the first annotation guessed a female pocket underneath,
# which is the wrong gender on the wrong face.
2654.dat:
  role: structural
  ground_contact: true
  shafts:
    - {type: stud, origin: [10, 0, 10], axis: [0, -1, 0], t0: 0, t1: 4}
    - {type: stud, origin: [10, 0, -10], axis: [0, -1, 0], t0: 0, t1: 4}
    - {type: stud, origin: [-10, 0, 10], axis: [0, -1, 0], t0: 0, t1: 4}
    - {type: stud, origin: [-10, 0, -10], axis: [0, -1, 0], t0: 0, t1: 4}

