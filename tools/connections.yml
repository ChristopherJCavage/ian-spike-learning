  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -20, t1: 8}

# ---------------------------------------------------------------------------
# Bushes sit on axles; they are retainers, not two-ended fasteners.
# Marked structural so "joins two parts" does not apply; "must have a joint"
# still does -- a bush in mid-air fails. A bush's entire job is to ride an
# axle without locking it, so it -- and whatever else only ever reaches the
# model through that same free-spinning axle -- is exempt from the rigid
# cluster hinge check (rotates: true).
4265c.dat:
  role: structural
  rotates: true
  features:
    - {kind: axle_hole, gender: female, origin: [0, 0, 0], axis: [0, 0, 1], depth: 10}

32123b.dat:
  role: structural
  rotates: true
  features:
    - {kind: axle_hole, gender: female, origin: [0, 0, 0], axis: [0, 0, 1], depth: 10}

32123.dat:
  role: structural
  rotates: true
  features:
    - {kind: axle_hole, gender: female, origin: [0, 0, 0], axis: [0, 0, 1], depth: 10}

3713.dat:
  role: structural
  rotates: true
  features:
    - {kind: axle_hole, gender: female, origin: [0, 0, 0], axis: [0, 0, 1], depth: 20}

# ---------------------------------------------------------------------------
# Electronics -- output discs have axle holes LDraw does not emit
# Disc is at local (0, -50, 0), axis along local Y (out of the disc face).
# ---------------------------------------------------------------------------
54675.dat:
  role: structural
  features:
    - {kind: axle_hole, gender: female, origin: [0, -50, 0], axis: [0, 1, 0], depth: 20}

54696p01.dat:
  role: structural
  features:
    - {kind: axle_hole, gender: female, origin: [0, -50, 0], axis: [0, 1, 0], depth: 20}

68488.dat:
  role: structural
  features:
    - {kind: axle_hole, gender: female, origin: [0, -50, 0], axis: [0, 1, 0], depth: 20}

45601.dat:
  role: structural
  # Six sockets, three down each long side at y = -68, z = -40 / 0 / 40.
  # Same 23807 socket and same plug as the Essential hub, so the same
  # 34 x 18 x 20 block of air has to stay empty in front of each one --
  # and on this hub they point sideways, straight into whatever gets
  # bolted to the flanks. Names are geometric; see the note on 67351.
  ports:
    - {name: "+x rear",  origin: [69, -68, -40], axis: [1, 0, 0], up: [0, 1, 0]}
    - {name: "+x mid",   origin: [69, -68, 0], axis: [1, 0, 0], up: [0, 1, 0]}
    - {name: "+x front", origin: [69, -68, 40], axis: [1, 0, 0], up: [0, 1, 0]}
    - {name: "-x rear",  origin: [-69, -68, -40], axis: [-1, 0, 0], up: [0, 1, 0]}
    - {name: "-x mid",   origin: [-69, -68, 0], axis: [-1, 0, 0], up: [0, 1, 0]}
    - {name: "-x front", origin: [-69, -68, 40], axis: [-1, 0, 0], up: [0, 1, 0]}

67351.dat:
  role: structural
  # Both cable ports are on the same face. LDraw draws the sockets
  # (23807.dat at (+-40, -68, 49), turned 180 degrees about Y so the bore
  # runs inward), but nothing in the file says a plug needs room in front
  # of them, so a head built onto the brow will happily seal them shut.
  # Origin is the mouth of the socket, axis points the way the plug comes
  # in, up is the short side of the rectangular opening.
  #
  # Names are geometric on purpose. Which socket is lettered A and which
  # is B is printed on the plastic and is not recoverable from the part
  # file, so calling them A and B here would be inventing a fact. Read
  # the letters off the real hub.
  ports:
    - {name: "+x", origin: [40, -68, 49], axis: [0, 0, 1], up: [0, 1, 0]}
    - {name: "-x", origin: [-40, -68, 49], axis: [0, 0, 1], up: [0, 1, 0]}

37316.dat:
  role: structural

37308.dat:
  role: structural
  # Lens sits at local z = -49, so native 'front' is -Z. The chameleon
  # aims this at the ground (+Y); that is a FACES assertion, not FRONT.
  facing: -Z

47592.dat:
  role: structural
  # Same housing as the colour sensor; LEDs face local -Z.
  facing: -Z

37312.dat:
  role: structural

# ---------------------------------------------------------------------------
# Wheel dia.56 -- spoke pin holes exist as primitives; the centre CROSS
# axle hole is mesh-only. Native wheel axis is Z. Wheels are meant to
# spin on their axle, so a single cross_axle reaching one is not a hinge.
# ---------------------------------------------------------------------------
39367.dat:
  role: structural
  rotates: true
  ground_contact: true
  features:
    - {kind: axle_hole, gender: female, origin: [0, 0, 0], axis: [0, 0, 1], depth: 35}

# ---------------------------------------------------------------------------
# Wedge-belt wheel D24 -- the Essential kit's pulley, and with tyre 2815
# stretched over it, also its drive wheel. LDraw already emits the centre
# cross bore as a primitive, so no features are needed here; what LDraw
# cannot say is that the thing SPINS. Without rotates, every pulley on an
# axle reads as a one-joint subassembly and trips the rigid cluster hinge
# rule -- which is the same reason 39367 carries it.
# Proved by tools/fixtures/good-belt-on-pulleys.ldr.
# ---------------------------------------------------------------------------
4185b.dat:
  role: structural
  rotates: true

# ---------------------------------------------------------------------------
# Drill bit cone -- reused here as the spinning tip of the mining drill,
# driven by the same cross axle that runs the bush above.
# ---------------------------------------------------------------------------
14918.dat:
  role: structural
  rotates: true

# Seat 4079 is a 2x2 with a backrest. LDraw emits only the centre underside
# tube (stud4 at the origin) and two top studs; the four corner tubes that
# actually clutch a plate are missing. Origins are at the underside face
# (local y=8) so the 4 LDU stud shaft overlaps the bore.
4079.dat:
  role: structural
  features:
    - {kind: pin_hole, gender: female, origin: [10, 8, 10], axis: [0, -1, 0], depth: 8}
    - {kind: pin_hole, gender: female, origin: [10, 8, -10], axis: [0, -1, 0], depth: 8}
    - {kind: pin_hole, gender: female, origin: [-10, 8, 10], axis: [0, -1, 0], depth: 8}
    - {kind: pin_hole, gender: female, origin: [-10, 8, -10], axis: [0, -1, 0], depth: 8}

# Round dish -- LDraw already emits a stud and an underside tube.
35394.dat:
  role: structural

# The kit's big white baseplates. LDraw emits all 256 top studs via nested
