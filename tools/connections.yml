# ===========================================================================
# Expansion Set 45681. Extents below are measured with `ldrcheck measure`,
# not guessed: a pin's shaft runs the part's own X extent unless noted.
# ===========================================================================

# --- Smooth (frictionless) pins. Same bore as a friction pin, but they are
# --- meant to spin, so anything hanging off one is not a rigid hinge.
3673.dat:
  role: connector
  rotates: true
  shafts:
    - {type: smooth_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -20, t1: 20}

39888.dat:
  role: connector
  rotates: true
  shafts:
    - {type: smooth_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -30, t1: 30}

# Pin 1/2: one module of pin with a stud on the end. LDraw already emits
# the stud, so only the shaft is missing.
4274.dat:
  role: connector
  rotates: true
  shafts:
    - {type: smooth_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -20, t1: 0}

# --- Axle-pin combinations: friction pin one end, cross axle the other.
43093.dat:
  role: connector
  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -20, t1: 0}
    - {type: cross_axle,   origin: [0, 0, 0], axis: [1, 0, 0], t0: 0, t1: 19.5}

11214.dat:
  role: connector
  shafts:
    - {type: friction_pin, origin: [0, 0, 0], axis: [1, 0, 0], t0: -30, t1: 10}
    - {type: cross_axle,   origin: [0, 0, 0], axis: [1, 0, 0], t0: 10, t1: 29.5}

# 1M beam with an axle stub. Structural, not connector -- it is regularly
# used as an end stop with only one joint.
22961.dat:
  role: structural
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: 9, t1: 29.5}

# Catch with a 1.5M axle, native along +Y.
6553.dat:
  role: structural
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [0, 1, 0], t0: 9, t1: 49.5}

# --- Plain cross axles.
3708.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -119.5, t1: 119.5}

50450.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -319.5, t1: 319.5}

# --- Axles with an end stop. The stop flange is the last half module and
# --- cannot enter a hole, so the shaft stops short of it.
87083.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -39.5, t1: 30}

15462.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -49.5, t1: 40}

55013.dat:
  role: connector
  shafts:
    - {type: cross_axle, origin: [0, 0, 0], axis: [1, 0, 0], t0: -79.5, t1: 70}

