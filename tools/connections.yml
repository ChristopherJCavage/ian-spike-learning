# ---------------------------------------------------------------------------
# The 1xN Technic bricks. LDraw draws their undersides with hollow-stud
# rings sitting BETWEEN the top studs, and the extractor reads those rings
# as male studs pointing down -- so out of the box these bricks could not
# stack on anything. A brick really grips a stud row directly below its own
# top studs, which is what these say. Same convention as 39789 below: the
# bottom face is y=24 and each anti-stud is 8 deep.
#
# This matters more than it looks. Laid with its length fore-and-aft a
# Technic brick is the only thing in the Essential kit that offers a
# transverse (world X) hole while still sitting on studs, which makes it
# the bearing for any cross-model axle. Proved by
# tools/fixtures/good-technic-brick-on-plate.ldr.
# ---------------------------------------------------------------------------
3700.dat:
  role: structural
  features:
    - {kind: anti_stud, gender: female, origin: [-10, 24, 0], axis: [0, -1, 0], depth: 8}
    - {kind: anti_stud, gender: female, origin: [10, 24, 0], axis: [0, -1, 0], depth: 8}

3701.dat:
  role: structural
  features:
    - {kind: anti_stud, gender: female, origin: [-30, 24, 0], axis: [0, -1, 0], depth: 8}
